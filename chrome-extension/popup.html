<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1F2937;
      background: #fff;
    }
    .header {
      background: #2563EB;
      color: white;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #86efac;
    }
    .header .dot.inactive { background: #fca5a5; }
    .body { padding: 16px; }
    label { display: block; font-size: 12px; color: #6B7280; margin-bottom: 4px; }
    input[type=text] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input[type=text]:focus { border-color: #2563EB; }
    .row { margin-bottom: 14px; }
    .btn {
      width: 100%;
      padding: 9px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.secondary {
      background: #F3F4F6;
      color: #374151;
      margin-top: 8px;
    }
    .btn.secondary:hover { background: #E5E7EB; }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success { background: #ECFDF5; color: #065F46; display: block; }
    .status.error { background: #FEF2F2; color: #991B1B; display: block; }
    .counter {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #6B7280;
    }
    .counter span { font-weight: 700; color: #2563EB; font-size: 20px; display: block; }
    .tracking-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #F9FAFB;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .toggle-label { font-size: 13px; font-weight: 500; }
    .toggle {
      position: relative; width: 36px; height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #D1D5DB; border-radius: 20px;
      transition: .2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: .2s;
    }
    input:checked + .slider { background: #2563EB; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot inactive" id="statusDot"></div>
    Code2Guide
  </div>
  <div class="body">
    <div id="setupView">
      <div class="row">
        <label>Токен проекта</label>
        <input type="text" id="tokenInput" placeholder="Вставьте токен из Code2Guide">
      </div>
      <div class="row">
        <label>URL Code2Guide</label>
        <input type="text" id="serverInput" placeholder="http://127.0.0.1:8000" value="http://127.0.0.1:8000">
      </div>
      <button class="btn" id="saveBtn">Подключить</button>
      <div class="status" id="statusMsg"></div>
    </div>

    <div id="activeView" style="display:none">
      <div class="tracking-toggle">
        <span class="toggle-label">Снимать скриншоты</span>
        <label class="toggle">
          <input type="checkbox" id="trackingToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="counter">
        <span id="countEl">0</span>
        скриншотов отправлено
      </div>
      <button class="btn secondary" id="screenshotNow">📸 Снять сейчас</button>
      <button class="btn secondary" style="margin-top:8px" id="disconnectBtn">Отключить</button>
      <div class="status" id="activeStatus"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
